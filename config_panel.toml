version = "1.0"

[main]
name = "Cheruby Docs"

    [main.user]
    name = "User"
    help = "Whose tokens and search index these are. Changing the user rebuilds the index but keeps the folders below: check them."

        [main.user.docs_user]
        ask = "User"
        type = "user"
        bind = "settings"

    [main.syncthing]
    name = "Syncthing"
    help = "Folders that Syncthing syncs on this server, each under its Syncthing label."

        [main.syncthing.syncthing_enabled]
        ask = "Open Syncthing folders"
        type = "boolean"
        bind = "settings"

        # The choices are Syncthing's folders, filled when the panel opens.
        [main.syncthing.syncthing_folders]
        ask = "Folders"
        type = "tags"
        optional = true
        help = "Empty opens all of Syncthing's folders, photo folders included. One added in Syncthing later opens at the next save or upgrade."
        bind = "settings"

        [main.syncthing.syncthing_only]
        ask = "Only these files"
        type = "tags"
        optional = true
        help = "Empty keeps every file. Otherwise only what matches, or lies in a folder that matches. *.pdf or Factures match any name; Documents/Factures matches from the folder on. Case is ignored, and * crosses folders."
        bind = "settings"

        [main.syncthing.syncthing_skip]
        ask = "Leave out"
        type = "tags"
        optional = true
        help = "What matches is left out with all it holds: not listed, found, read nor searched. *.tmp or Old match any name; Documents/Old matches from the folder on. Case is ignored, and * crosses folders."
        bind = "settings"

        # Filled when the panel opens: whether the app can read each folder.
        [main.syncthing.syncthing_status]
        ask = "No folder open."
        type = "markdown"
        bind = "null"

    [main.local]
    name = "Local storage"
    help = "Any folder on this server. The app joins each folder's group to read it, so its files must be readable by that group."

        [main.local.local_enabled]
        ask = "Open local folders"
        type = "boolean"
        bind = "settings"

        [main.local.local_folders]
        ask = "Folders"
        type = "text"
        optional = true
        example = "Archives=/home/yunohost.app/archives"
        help = "One per line: <Label>=<path>. The label is what the AI agents see: letters, digits, _ . - and no space."
        bind = "settings"

        [main.local.local_only]
        ask = "Only these files"
        type = "tags"
        optional = true
        help = "Empty keeps every file. Otherwise only what matches, or lies in a folder that matches. *.pdf or Factures match any name; Documents/Factures matches from the folder on. Case is ignored, and * crosses folders."
        bind = "settings"

        [main.local.local_skip]
        ask = "Leave out"
        type = "tags"
        optional = true
        help = "What matches is left out with all it holds: not listed, found, read nor searched. *.tmp or Old match any name; Documents/Old matches from the folder on. Case is ignored, and * crosses folders."
        bind = "settings"

        # Filled when the panel opens: whether the app can read each folder.
        [main.local.local_status]
        ask = "No folder open."
        type = "markdown"
        bind = "null"

    [main.nextcloud]
    name = "Nextcloud"
    help = "Folders of the user's Nextcloud account, shares from others included, read through Nextcloud. The app makes itself an app password, listed as cheruby-docs-mcp in the user's Nextcloud security settings, and deletes it when this source is turned off."

        [main.nextcloud.nextcloud_enabled]
        ask = "Open Nextcloud folders"
        type = "boolean"
        bind = "settings"

        [main.nextcloud.nextcloud_folders]
        ask = "Folders"
        type = "text"
        optional = true
        example = "Cloud=/Documents"
        help = "One per line: <Label>=<folder in the account>, / for all of it. Empty opens the whole account as Nextcloud. The label is what the AI agents see: letters, digits, _ . - and no space."
        bind = "settings"

        [main.nextcloud.nextcloud_only]
        ask = "Only these files"
        type = "tags"
        optional = true
        help = "Empty keeps every file. Otherwise only what matches, or lies in a folder that matches. *.pdf or Factures match any name; Cloud/Factures matches from the folder on. Case is ignored, and * crosses folders."
        bind = "settings"

        [main.nextcloud.nextcloud_skip]
        ask = "Leave out"
        type = "tags"
        optional = true
        help = "What matches is left out with all it holds: not listed, found, read nor searched. *.tmp or Old match any name; Cloud/Old matches from the folder on. Case is ignored, and * crosses folders."
        bind = "settings"

        # Filled when the panel opens: whether Nextcloud lets the app read each folder.
        [main.nextcloud.nextcloud_status]
        ask = "No folder open."
        type = "markdown"
        bind = "null"

    [main.whoopy]
    name = "Whoopy access"
    help = "Whoopy holds one token for this app. It opens the folders chosen here, and searches the user's index."

        [main.whoopy.whoopy_folders]
        ask = "Folders"
        type = "tags"
        optional = true
        help = "Labels of the folders opened above, such as Documents. Empty opens all of them."
        # Checked on the tags joined by commas, not tag by tag.
        pattern.regexp = '^[A-Za-z0-9][A-Za-z0-9_.-]*(,[A-Za-z0-9][A-Za-z0-9_.-]*)*$'
        pattern.error = "Folder labels, such as Documents"
        bind = "settings"

    # Its own section: a section holding a button runs actions and saves nothing.
    [main.whoopy_token]
    name = "Whoopy token"
    help = "Paste it in Whoopy's panel, with the address shown under it."

        # Read by ynh_app_config_show with the trace off, never by the traced getter.
        [main.whoopy_token.whoopy_token]
        ask = "Token"
        type = "string"
        readonly = true
        redact = true
        bind = "null"

        [main.whoopy_token.new_token]
        ask = "New token"
        type = "button"
        style = "warning"
        help = "Makes another token and restarts the service. The old one stops working: paste the new one in Whoopy."

    [main.monitoring]
    name = "Index monitoring"
    help = "Pings a healthchecks.io check when each hourly index run starts, succeeds or fails, so a run that fails or never comes raises an alert. Suggested check: period 1 hour, grace 2 hours."

        [main.monitoring.healthcheck_enabled]
        ask = "Ping healthchecks.io on each index run"
        type = "boolean"
        bind = "settings"

        [main.monitoring.healthcheck_url]
        ask = "Ping URL of the check"
        type = "string"
        optional = true
        example = "https://hc-ping.com/<uuid>"
        help = "From the check's page on healthchecks.io, without /start or /fail."
        pattern.regexp = '^$|^https://[A-Za-z0-9.-]+(:[0-9]+)?/[A-Za-z0-9/_.-]+[A-Za-z0-9]$'
        pattern.error = "An https address such as https://hc-ping.com/<uuid>, without a trailing /"
        bind = "settings"

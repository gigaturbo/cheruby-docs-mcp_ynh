version = "1.0"

[main]
name = "Cheruby Docs"

    [main.user]
    name = "User"
    help = "Whose tokens and search index these are. Changing the user rebuilds the index but keeps the folders below: check them."

        [main.user.docs_user]
        ask = "User"
        type = "user"
        bind = "settings"

    [main.syncthing]
    name = "Syncthing"
    help = "Folders that Syncthing syncs on this server, each under its Syncthing label. Which files of them the agents see is set on the app's page, Config tab."

        [main.syncthing.syncthing_enabled]
        ask = "Open Syncthing folders"
        type = "boolean"
        bind = "settings"

        # The choices are Syncthing's folders, filled when the panel opens.
        [main.syncthing.syncthing_folders]
        ask = "Folders"
        type = "tags"
        optional = true
        help = "Empty opens all of Syncthing's folders, photo folders included. One added in Syncthing later opens at the next save or upgrade."
        bind = "settings"

        [main.syncthing.syncthing_writable]
        ask = "Writable folders"
        type = "tags"
        optional = true
        help = "Labels of folders above, as the AI agents see them, such as Android_Pictures, where they may create a text file or replace one. Nothing is ever deleted. A change goes to every device, and Syncthing keeps the old file only on the devices with File Versioning on, never on this server, where the change is made. Receive-only folders stay read-only."
        # Checked on the tags joined by commas, not tag by tag.
        pattern.regexp = '^[A-Za-z0-9][A-Za-z0-9_.-]*(,[A-Za-z0-9][A-Za-z0-9_.-]*)*$'
        pattern.error = "Folder labels, such as Documents"
        bind = "settings"

        # Filled when the panel opens: whether the app can read each folder.
        [main.syncthing.syncthing_status]
        ask = "No folder open."
        type = "markdown"
        bind = "null"

    [main.local]
    name = "Local storage"
    help = "Any folder on this server. The app joins each folder's group to read it, so its files must be readable by that group. Which files of them the agents see is set on the app's page, Config tab."

        [main.local.local_enabled]
        ask = "Open local folders"
        type = "boolean"
        bind = "settings"

        [main.local.local_folders]
        ask = "Folders"
        type = "text"
        optional = true
        example = "Archives=/home/yunohost.app/archives"
        help = "One per line: <Label>=<path>. The label is what the AI agents see: letters, digits, _ . - and no space."
        bind = "settings"

        [main.local.local_writable]
        ask = "Writable folders"
        type = "tags"
        optional = true
        help = "Labels of folders above, as the AI agents see them, such as Archives, where they may create a text file or replace one. Nothing is ever deleted. The folder's group must be able to change its files: the status below says what it cannot. Nothing keeps the old content of a replaced file."
        # Checked on the tags joined by commas, not tag by tag.
        pattern.regexp = '^[A-Za-z0-9][A-Za-z0-9_.-]*(,[A-Za-z0-9][A-Za-z0-9_.-]*)*$'
        pattern.error = "Folder labels, such as Documents"
        bind = "settings"

        # Filled when the panel opens: whether the app can read each folder.
        [main.local.local_status]
        ask = "No folder open."
        type = "markdown"
        bind = "null"

    [main.nextcloud]
    name = "Nextcloud"
    help = "Folders of a Nextcloud account, shares from others included, read through Nextcloud with an app password you make there and paste here. Which files of them the agents see is set on the app's page, Config tab."

        [main.nextcloud.nextcloud_enabled]
        ask = "Open Nextcloud folders"
        type = "boolean"
        bind = "settings"

        [main.nextcloud.nextcloud_account]
        ask = "Nextcloud login"
        type = "string"
        optional = true
        help = "Empty means the user above. An app password can change and delete files: another account, given read-only shares of the folders, keeps the app from changing anything."
        pattern.regexp = '^[A-Za-z0-9_.@-]*$'
        pattern.error = "A Nextcloud login: letters, digits, _ . @ -"
        bind = "settings"

        # Never shown and never traced: stored by set__nextcloud_password with the trace off.
        [main.nextcloud.nextcloud_password]
        ask = "App password"
        type = "password"
        optional = true
        help = "In Nextcloud, logged in as that account: Personal settings, Security, Devices & sessions, Create new app password, named Cheruby Docs (not an OAuth 2.0 client). Paste the password it shows, xxxxx-xxxxx-xxxxx-xxxxx-xxxxx. Empty keeps the one saved. Revoke it there to cut the app off."
        bind = "null"

        [main.nextcloud.nextcloud_folders]
        ask = "Folders"
        type = "text"
        optional = true
        example = "Cloud=/Documents"
        help = "One per line: <Label>=<folder in the account>, / for all of it. Empty opens the whole account as Nextcloud. The label is what the AI agents see: letters, digits, _ . - and no space."
        bind = "settings"

        [main.nextcloud.nextcloud_writable]
        ask = "Writable folders"
        type = "tags"
        optional = true
        help = "Labels of folders above, as the AI agents see them, such as Cloud, where they may create a text file or replace one. Nothing is ever deleted. The Nextcloud login above must be allowed to change them. Nextcloud keeps the old versions."
        # Checked on the tags joined by commas, not tag by tag.
        pattern.regexp = '^[A-Za-z0-9][A-Za-z0-9_.-]*(,[A-Za-z0-9][A-Za-z0-9_.-]*)*$'
        pattern.error = "Folder labels, such as Documents"
        bind = "settings"

        # Filled when the panel opens: whether Nextcloud lets the app read each folder.
        [main.nextcloud.nextcloud_status]
        ask = "No folder open."
        type = "markdown"
        bind = "null"

    [main.whoopy]
    name = "Whoopy access"
    help = "Whoopy holds one token for this app. It opens the folders chosen here, and searches the user's index."

        [main.whoopy.whoopy_folders]
        ask = "Folders"
        type = "tags"
        optional = true
        help = "Picked from the folders opened above, as saved: save a source first to pick its new folders. Empty opens all of them."
        # Checked on the tags joined by commas, not tag by tag.
        pattern.regexp = '^[A-Za-z0-9][A-Za-z0-9_.-]*(,[A-Za-z0-9][A-Za-z0-9_.-]*)*$'
        pattern.error = "Folder labels, such as Documents"
        bind = "settings"

    # Its own section: a section holding a button runs actions and saves nothing.
    [main.mcp]
    name = "MCP token"
    help = "The token Whoopy presents, with the address shown under it. Both go into Whoopy's status page, MCP Servers tab, as the server docs."

        # Read by ynh_app_config_show with the trace off, never by the traced getter.
        [main.mcp.mcp_token]
        ask = "Token"
        type = "string"
        readonly = true
        redact = true
        bind = "null"

        [main.mcp.new_token]
        ask = "New token"
        type = "button"
        style = "warning"
        help = "Makes another token and restarts the service, as `sudo cheruby-docs-mcp token --new` does. The old one stops working: give the new one to the server docs in Whoopy's admin page, MCP Servers."

    [main.index]
    name = "Search index"
    help = "The index is how search finds documents by meaning. Each run reads only the files that changed; the first one reads them all, which takes hours on many files. When it runs, and its quiet hours, are set on the app's page, Config tab."

        [main.index.embed_model]
        ask = "Embedding model"
        type = "select"
        choices.embeddinggemma-300m-q8 = "EmbeddingGemma 300M, Q8 (334 MB)"
        choices.embeddinggemma-300m-q4 = "EmbeddingGemma 300M, Q4 (278 MB)"
        choices.jina-embeddings-v5-text-nano-q8 = "jina-embeddings-v5-text-nano, Q8 (233 MB), non-commercial"
        choices.jina-embeddings-v5-text-nano-q4 = "jina-embeddings-v5-text-nano, Q4 (157 MB), non-commercial"
        choices.qwen3-embedding-600m-q8 = "Qwen3-Embedding 0.6B, Q8 (639 MB)"
        choices.qwen3-embedding-600m-q4 = "Qwen3-Embedding 0.6B, Q4 (396 MB)"
        help = "What turns passages and queries into the vectors search compares. A change downloads the model, stops a run and makes the next run read every file again, which takes hours on many files; until then search matches keywords only, then answers from what is done. Q4 is smaller and faster, Q8 a little more exact. jina-embeddings-v5-text-nano is CC-BY-NC-4.0: non-commercial use only. Qwen3-Embedding is the largest and slowest."
        bind = "settings"

    [main.remote]
    name = "Desktop embedding"
    help = "Run now on the desktop reads the files on this server as usual but has the desktop's GPU, through Whoopy, turn the passages into vectors: a first index of many files takes minutes instead of hours. Search still does it here for each question, so the run first compares about 20 passages done both ways and keeps to this server unless they agree. In Whoopy's admin page, make a key allowed only the model below."

        [main.remote.remote_model]
        ask = "Model in Whoopy"
        type = "string"
        optional = true
        example = "ollama-embed/embeddinggemma-300m-q8-2k:latest"
        help = "The embedding model chosen above, as Whoopy names it on the desktop: ollama-embed/ then its name in Ollama. Not ollama/, which cannot embed, nor Whoopy's embeddinggemma, which is this server's. jina-embeddings-v5-text-nano is not in Ollama."
        bind = "settings"

        # Never shown and never traced: stored by set__remote_key with the trace off.
        [main.remote.remote_key]
        ask = "Whoopy key"
        type = "password"
        optional = true
        help = "A key allowed the model above only. Empty keeps the one saved."
        bind = "null"

        [main.remote.remote_url]
        ask = "Whoopy address"
        type = "string"
        optional = true
        example = "http://127.0.0.1:4000"
        help = "On this server: the index is not allowed to reach any other machine."
        pattern.regexp = '^$|^http://127\.0\.0\.1:[0-9]+/?$'
        pattern.error = "An address on this server, such as http://127.0.0.1:4000"
        bind = "settings"

    # Its own section: a section holding a button runs actions and saves nothing.
    [main.index_runs]
    name = "Index runs"
    help = "Run now starts a run without waiting for the schedule set on the app's page, even in the quiet hours, and does nothing while one runs. Run now on the desktop does the same with the desktop's GPU (Desktop embedding above); when Whoopy cannot be reached or the vectors do not agree, the run goes on here. The schedule never uses the desktop. Rebuild stops a run and drops the index: the next run reads every file again, which takes hours on many, and search answers from the old index only for its first ten minutes."

        # Filled when the panel opens, from the status file the indexer writes.
        [main.index_runs.index_status]
        ask = "No run yet."
        type = "markdown"
        bind = "null"

        [main.index_runs.run_index]
        ask = "Run now"
        type = "button"

        [main.index_runs.run_index_remote]
        ask = "Run now on the desktop"
        type = "button"

        [main.index_runs.rebuild_index]
        ask = "Rebuild"
        type = "button"
        style = "danger"

    [main.speech]
    name = "Speech to text"
    help = "transcribe_file and the page's Transcribe tab turn a recording into text, here or, when allowed below, on the desktop's GPU through Whoopy. A recording is cut in parts of about ten minutes; an hour of audio takes about 15 minutes here with whisper small, about an hour with large-v3-turbo."

        [main.speech.speech_model]
        ask = "Speech model on this server"
        type = "select"
        choices.whisper-small-q8 = "whisper small, Q8 (264 MB)"
        choices.whisper-large-v3-turbo-q8 = "whisper large-v3-turbo, Q8 (874 MB)"
        help = "small is about four times faster; large-v3-turbo gets the punctuation, the capitals and more of the words right, and takes about as long as the recording. A change downloads the model and restarts the tool server: a transcription going on carries on at the next call."
        bind = "settings"

        [main.speech.speech_engine]
        ask = "The desktop"
        type = "select"
        choices.pi = "Never: always on this server"
        choices.demand = "When an agent or the page asks for it"
        choices.always = "Always, this server when the desktop fails"
        help = "The desktop transcribes an hour in a few minutes. It is woken through Whoopy, which takes up to two minutes; when it still does not answer, the rest of the recording is done here."
        bind = "settings"

        [main.speech.speech_remote_model]
        ask = "Speech model in Whoopy"
        type = "string"
        optional = true
        example = "speaches/Systran/faster-whisper-large-v3"
        help = "As Whoopy names it: speaches/ then the model's name in Speaches on the desktop. Whoopy's address is the one under Desktop embedding."
        bind = "settings"

        # Never shown and never traced: stored by set__speech_remote_key with the trace off.
        [main.speech.speech_remote_key]
        ask = "Whoopy key for speech"
        type = "password"
        optional = true
        help = "A key allowed the speech model above only. The tool server holds it, unlike the embedding key. Empty keeps the one saved."
        bind = "null"

    [main.monitoring]
    name = "Index monitoring"
    help = "Pings a healthchecks.io check's /fail when an index run fails, whoever started it, and a success when a run the schedule or Run now started ends well, so a run that fails or never comes raises an alert. Runs an agent asks for with run_index send no success. Suggested check: the period of the schedule set on the app's page, grace 2 hours; none when it is never."

        [main.monitoring.healthcheck_enabled]
        ask = "Ping healthchecks.io on index runs"
        type = "boolean"
        bind = "settings"

        [main.monitoring.healthcheck_url]
        ask = "Ping URL of the check"
        type = "string"
        optional = true
        example = "https://hc-ping.com/<uuid>"
        help = "From the check's page on healthchecks.io, without /start or /fail."
        pattern.regexp = '^$|^https://[A-Za-z0-9.-]+(:[0-9]+)?/[A-Za-z0-9/_.-]+[A-Za-z0-9]$'
        pattern.error = "An https address such as https://hc-ping.com/<uuid>, without a trailing /"
        bind = "settings"

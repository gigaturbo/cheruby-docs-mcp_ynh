#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "cheruby-docs-mcp"
name = "Cheruby Docs"
description.en = "MCP tools that let a user's AI agents list, find, read and search that user's folders, and write where allowed"
description.fr = "Outils MCP : les agents IA d'un utilisateur listent, cherchent, lisent et fouillent ses dossiers, et écrivent là où c'est permis"

version = "0.15.0~ynh1"

maintainers = ["gigaturbo"]

[upstream]
license = "MIT"

[integration]
yunohost = ">= 12.1"
helpers_version = "2.1"
# The tool server and llama-server are built for the Pi 5 only.
architectures = ["arm64"]
multi_instance = false
ldap = false
sso = true
# The embedding model (up to 640 MB) and the reranker (310 MB), llama-server,
# the speech model (up to 875 MB), the tool server and PDFium; the index grows
# with the folders.
disk = "2700M"
ram.build = "50M"
# Qwen3-Embedding Q8_0 takes about 1 GB more than EmbeddingGemma: as a causal
# model it keeps a KV cache (1.7 GB at most, measured on b12223). whisper
# small takes about 0.6 GB, large-v3-turbo about 1.2 GB (measured on v1.9.6).
ram.runtime = "4000M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/docs"

    [install.docs_user]
    ask.en = "User whose folders the AI agents reach"
    ask.fr = "Utilisateur dont les agents IA atteignent les dossiers"
    help.en = "The folders are chosen after the install, in the config panel: Syncthing folders, local folders, and which are writable. What to leave out of them is set on the app's page, which only this user may open."
    help.fr = "Les dossiers se choisissent après l'installation, dans le panneau de configuration : dossiers Syncthing, dossiers locaux, et lesquels sont modifiables. Ce qu'il faut en exclure se règle sur la page de l'app, que seul cet utilisateur peut ouvrir."
    type = "user"

[resources]

    # The tool server, the indexer and their commands, built from cheruby-docs/
    # on the Pi and published as a release of this repository.
    [resources.sources.cheruby_docs]
    url = "https://github.com/gigaturbo/cheruby-docs-mcp_ynh/releases/download/cheruby-docs-0.14.0/cheruby-docs-aarch64-linux"
    sha256 = "4df33da2e0ac434e6da94b12afac0ecf92853710dfbe36b71217684785e3614f"
    extract = false
    rename = "cheruby-docs"

    # PDFium, which reads PDFs: chromium/8076 from bblanchon/pdfium-binaries,
    # the build pypdfium2 5.14 shipped, so the text is the same.
    # BSD-3-Clause and Apache-2.0 (LICENSE and licenses/ in it).
    [resources.sources.pdfium]
    url = "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8076/pdfium-linux-arm64.tgz"
    sha256 = "d7247b33ae5545615a5e877235dd97afc879e3a8805689684f528cae3339d352"
    format = "tar.gz"
    in_subdir = false

    # llama-server from llama.cpp b12223, built for the Pi 5 by build/llama-server.sh
    # in this repository's release workflow: upstream's arm64 builds need a newer
    # glibc than Debian 12's. MIT, like llama.cpp (LICENSE in the release).
    [resources.sources.llama_server]
    url = "https://github.com/gigaturbo/cheruby-docs-mcp_ynh/releases/download/llama-server-b12223/llama-server-b12223-debian12-arm64"
    sha256 = "729b40f28c62097ac7d528d9a0768db8a7f2c8a8d999785d6032e55f1cd35606"
    extract = false
    rename = "llama-server"

    # The embedding models of the search index, one chosen in the config panel
    # (embed_model in _common.sh), each at a fixed revision. Only the chosen one
    # is fetched.

    # EmbeddingGemma 300M, Q8_0: the default. Gemma terms of use.
    [resources.sources.model]
    url = "https://huggingface.co/ggml-org/embeddinggemma-300M-GGUF/resolve/0f741b5a6585bd53aeb15cd1372c56f2a0f65e12/embeddinggemma-300M-Q8_0.gguf"
    sha256 = "b5ce9d77a3fc4b3b39ccb5643c36777911cc4eb46a66962eadfa3f5f60490d63"
    extract = false
    rename = "embeddinggemma-300M-Q8_0.gguf"
    prefetch = false

    # EmbeddingGemma 300M, Q4_0 of Google's quantization-aware weights.
    [resources.sources.model_gemma_q4]
    url = "https://huggingface.co/unsloth/embeddinggemma-300m-GGUF/resolve/6661a6504c30d8304af13455cb4a5d4f5bc6011f/embeddinggemma-300m-Q4_0.gguf"
    sha256 = "edc6015cb15694c27be7d1d33f1bc015db9a358ff51ed524628c027504907ba9"
    extract = false
    rename = "embeddinggemma-300m-Q4_0.gguf"
    prefetch = false

    # jina-embeddings-v5-text-nano-retrieval, Q8_0 and Q4_K_M. Its licence is
    # CC-BY-NC-4.0: non-commercial use only.
    [resources.sources.model_jina_q8]
    url = "https://huggingface.co/jinaai/jina-embeddings-v5-text-nano-retrieval-GGUF/resolve/59cfaceeeb7d738c404659435af4c0da74d06c96/v5-nano-retrieval-Q8_0.gguf"
    sha256 = "86b6e6279e9b9e71389f02a082764a2ac2b15a50e37482c26f98d69092f12442"
    extract = false
    rename = "jina-embeddings-v5-text-nano-retrieval-Q8_0.gguf"
    prefetch = false

    [resources.sources.model_jina_q4]
    url = "https://huggingface.co/jinaai/jina-embeddings-v5-text-nano-retrieval-GGUF/resolve/59cfaceeeb7d738c404659435af4c0da74d06c96/v5-nano-retrieval-Q4_K_M.gguf"
    sha256 = "f50822244ba0c7a348c5455b99bb8a0afd182511e8a816888c5dc65d972e51d5"
    extract = false
    rename = "jina-embeddings-v5-text-nano-retrieval-Q4_K_M.gguf"
    prefetch = false

    # Qwen3-Embedding-0.6B, Apache-2.0: Qwen's own Q8_0, and mradermacher's
    # Q4_K_M, since Qwen publishes no Q4.
    [resources.sources.model_qwen_q8]
    url = "https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/370f27d7550e0def9b39c1f16d3fbaa13aa67728/Qwen3-Embedding-0.6B-Q8_0.gguf"
    sha256 = "06507c7b42688469c4e7298b0a1e16deff06caf291cf0a5b278c308249c3e439"
    extract = false
    rename = "Qwen3-Embedding-0.6B-Q8_0.gguf"
    prefetch = false

    [resources.sources.model_qwen_q4]
    url = "https://huggingface.co/mradermacher/Qwen3-Embedding-0.6B-GGUF/resolve/8c605f43dcb0b43cf6e4afc7203888d912a67ace/Qwen3-Embedding-0.6B.Q4_K_M.gguf"
    sha256 = "793cb15c8e0da4fe29f32ae0b3d604a92a9b1ecf5048cbfd65107faa38108b83"
    extract = false
    rename = "Qwen3-Embedding-0.6B-Q4_K_M.gguf"
    prefetch = false

    # whisper-server from whisper.cpp v1.9.6, built for the Pi 5 by
    # build/whisper-server.sh in this repository's release workflow, as
    # llama-server is. MIT, like whisper.cpp (LICENSE in the release).
    [resources.sources.whisper_server]
    url = "https://github.com/gigaturbo/cheruby-docs-mcp_ynh/releases/download/whisper-server-v1.9.6/whisper-server-v1.9.6-debian12-arm64"
    sha256 = "016e7a46e20877b730f047785a200ab83122e8500bca4fc47708c4c7a0709c68"
    extract = false
    rename = "whisper-server"

    # The speech models of transcribe_file, one chosen in the config panel
    # (speech_model in _common.sh), at a fixed revision. MIT, as OpenAI's
    # Whisper weights. Only the chosen one is fetched.
    [resources.sources.speech_model]
    url = "https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-small-q8_0.bin"
    sha256 = "49c8fb02b65e6049d5fa6c04f81f53b867b5ec9540406812c643f177317f779f"
    extract = false
    rename = "ggml-small-q8_0.bin"
    prefetch = false

    [resources.sources.speech_model_large]
    url = "https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-large-v3-turbo-q8_0.bin"
    sha256 = "317eb69c11673c9de1e1f0d459b253999804ec71ac4c23c17ecf5fbe24e259a1"
    extract = false
    rename = "ggml-large-v3-turbo-q8_0.bin"
    prefetch = false

    # Silero VAD v6.2.0 in ggml, which keeps whisper off the silences. MIT.
    [resources.sources.vad_model]
    url = "https://huggingface.co/ggml-org/whisper-vad/resolve/9ffd54a1e1ee413ddf265af9913beaf518d1639b/ggml-silero-v6.2.0.bin"
    sha256 = "2aa269b785eeb53a82983a20501ddf7c1d9c48e33ab63a41391ac6c9f7fb6987"
    extract = false
    rename = "ggml-silero-v6.2.0.bin"

    # jina-reranker-v2-base-multilingual, which orders search results by how well
    # they answer the query, at a fixed revision. Its licence is CC-BY-NC-4.0:
    # non-commercial use only.
    [resources.sources.rerank_model]
    url = "https://huggingface.co/gpustack/jina-reranker-v2-base-multilingual-GGUF/resolve/09a0e5b9f3d193a4f1e771ba6ceccdf1153d3a9a/jina-reranker-v2-base-multilingual-Q8_0.gguf"
    sha256 = "4dba405265ce8f00a4c6fa29d483585c11f5020ff37d61a1161c4e9be6348c18"
    extract = false
    rename = "jina-reranker-v2-base-multilingual-Q8_0.gguf"

    [resources.system_user]

    [resources.install_dir]
    # Code and secrets: root-owned, read by the app user through its group.
    owner = "root:rwx"
    group = "__APP__:rx"

    # The search index, one SQLite file per user. Rebuilt on the schedule, so not
    # backed up; kept on remove unless --purge, and cleared at install and restore.
    [resources.data_dir]
    owner = "__APP__:rwx"
    group = "__APP__:rx"

    [resources.ports]
    main.default = 8770
    embed.default = 8771
    rerank.default = 8774
    page.default = 8775
    speech.default = 8776

    # llama-server's and whisper-server's OpenMP runtime; ffmpeg decodes the
    # recordings for transcribe_file.
    [resources.apt]
    packages = ["libgomp1", "ffmpeg"]

    # The page, for the docs user only (docs_page_access); the AI gateway
    # reaches the tools on loopback, never through nginx.
    [resources.permissions]
    main.url = "/"
    main.auth_header = true
    main.show_tile = true
    # Blocks adding the visitors group.
    main.protected = true

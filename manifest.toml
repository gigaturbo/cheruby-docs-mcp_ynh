#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "cheruby-docs-mcp"
name = "Cheruby Docs"
description.en = "MCP tools that let a user's AI agents list, find, read and search that user's folders, and write where allowed"
description.fr = "Outils MCP : les agents IA d'un utilisateur listent, cherchent, lisent et fouillent ses dossiers, et écrivent là où c'est permis"

version = "0.8.0~ynh1"

maintainers = ["gigaturbo"]

[upstream]
license = "MIT"

[integration]
yunohost = ">= 12.1"
helpers_version = "2.1"
# The lock file holds aarch64 wheels only.
architectures = ["arm64"]
multi_instance = false
ldap = false
sso = false
# The two models (640 MB), llama-server and the venv; the index grows with the folders.
disk = "1500M"
# Compiling llama-server.
ram.build = "1500M"
ram.runtime = "1200M"

[install]
    [install.docs_user]
    ask.en = "User whose folders the AI agents reach"
    ask.fr = "Utilisateur dont les agents IA atteignent les dossiers"
    help.en = "The folders are chosen after the install, in the config panel: Syncthing folders, local folders, and what to leave out of them."
    help.fr = "Les dossiers se choisissent après l'installation, dans le panneau de configuration : dossiers Syncthing, dossiers locaux, et ce qu'il faut en exclure."
    type = "user"

[resources]

    # uv installs the locked wheels and checks every hash.
    [resources.sources.uv]
    arm64.url = "https://github.com/astral-sh/uv/releases/download/0.12.12/uv-aarch64-unknown-linux-gnu.tar.gz"
    arm64.sha256 = "fe08db50cc1b56cd1da7801065ed1103d27ed3f9571cd122386cfc7faf1b8df5"
    in_subdir = true
    autoupdate.strategy = "latest_github_release"
    autoupdate.upstream = "https://github.com/astral-sh/uv"
    autoupdate.asset.arm64 = "^uv-aarch64-unknown-linux-gnu.tar.gz$"

    # Built at install: the prebuilt arm64 binaries need a newer glibc than Debian 12's.
    [resources.sources.llama_cpp]
    url = "https://github.com/ggml-org/llama.cpp/archive/refs/tags/b12223.tar.gz"
    sha256 = "92210b1f75abd45e9122f5d7d7a6afd32fbfa663d7e200cf2ef576758cd5ef8a"

    # EmbeddingGemma 300M, the embedding model of the search index, at a fixed revision.
    [resources.sources.model]
    url = "https://huggingface.co/ggml-org/embeddinggemma-300M-GGUF/resolve/0f741b5a6585bd53aeb15cd1372c56f2a0f65e12/embeddinggemma-300M-Q8_0.gguf"
    sha256 = "b5ce9d77a3fc4b3b39ccb5643c36777911cc4eb46a66962eadfa3f5f60490d63"
    extract = false
    rename = "embeddinggemma-300M-Q8_0.gguf"

    # jina-reranker-v2-base-multilingual, which orders search results by how well
    # they answer the query, at a fixed revision. Its licence is CC-BY-NC-4.0:
    # non-commercial use only.
    [resources.sources.rerank_model]
    url = "https://huggingface.co/gpustack/jina-reranker-v2-base-multilingual-GGUF/resolve/09a0e5b9f3d193a4f1e771ba6ceccdf1153d3a9a/jina-reranker-v2-base-multilingual-Q8_0.gguf"
    sha256 = "4dba405265ce8f00a4c6fa29d483585c11f5020ff37d61a1161c4e9be6348c18"
    extract = false
    rename = "jina-reranker-v2-base-multilingual-Q8_0.gguf"

    [resources.system_user]

    [resources.install_dir]
    # Code and secrets: root-owned, read by the app user through its group.
    owner = "root:rwx"
    group = "__APP__:rx"

    # The search index, one SQLite file per user. Rebuilt by the timer, so not
    # backed up; kept on remove unless --purge, and cleared at install and restore.
    [resources.data_dir]
    owner = "__APP__:rwx"
    group = "__APP__:rx"

    [resources.ports]
    main.default = 8770
    embed.default = 8771
    rerank.default = 8774

    # To build llama-server.
    [resources.apt]
    packages = ["cmake", "g++", "make"]

    # No web page: the AI gateway reaches the server on loopback.
    [resources.permissions]
    main.show_tile = false

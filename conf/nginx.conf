#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

    # The trailing slash strips __PATH__; the page uses relative links only.
    proxy_pass http://127.0.0.1:__PORT_PAGE__/;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Proof the request came through here, not from a local account on the
    # loopback port.
    proxy_set_header X-Panel-Token __PANEL_TOKEN__;

    # A search reranks its results, a few seconds on the Pi.
    proxy_read_timeout 120s;

    include conf.d/yunohost_panel.conf.inc;
}

# The app's user may reach on loopback only the embedding, reranking and
# speech servers, Nextcloud (443) and the remote server for desktop embedding: not the raw
# ports of PostgreSQL, LDAP, Redis or the YunoHost API (B-P-5). 443 is nginx,
# so the web apps stay reachable behind their own logins. Its own server's
# answers are established connections. Rendered by docs_firewall, never
# backed up.
table inet __APP__
delete table inet __APP__
table inet __APP__ {
    chain output {
        type filter hook output priority filter; policy accept;
        oifname "lo" meta skuid __UID__ jump app_loopback
    }
    chain app_loopback {
        ct state established,related accept
        ip daddr 127.0.0.1 tcp dport { __PORTS__ } accept
        meta l4proto tcp counter reject with tcp reset
        counter reject
    }
}

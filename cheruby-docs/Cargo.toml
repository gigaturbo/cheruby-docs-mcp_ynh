[package]
name = "cheruby-docs"
version = "0.12.1"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive", "env"] }
html-escape = "0.3.1"
http = "1.5.0"
mail-parser = "1.0.1"
nix = { version = "0.32.0", features = ["user", "fs", "feature"] }
pdfium-render = { version = "0.9.5", default-features = false, features = ["thread_safe", "pdfium_7881"] }
percent-encoding = "2.3.2"
quick-xml = "0.42.0"
regex = "1.13.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "blocking"] }
rmcp = { version = "3.11", features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.43.0", features = ["bundled", "functions", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["fs", "macros", "net", "rt", "signal", "sync", "time"] }
unicode-normalization = "0.1.26"
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = true
lto = "thin"

    <path d="M 231,340 Q 240,333 249,340 Q 246,346 240,346 Q 234,346 231,340 Z" fill="#ff8fa8"/>

    <g transform="rotate(-30,136,270)">
      <path d="M 121,274 C 120,256 152,256 151,274 C 150,288 122,288 121,274 Z"

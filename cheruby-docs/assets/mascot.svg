    <circle cx="222" cy="236" r="5" fill="#ffffff" opacity="0.6"/>
    <path d="M 156,330 Q 166,366 200,384" fill="none" stroke="#ffffff" stroke-width="4"
       stroke-linecap="round" opacity="0.35"/>

    <!-- face: eyes shut with joy, open cat mouth, blush -->

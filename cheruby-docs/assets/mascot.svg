    <path d="M 360,206 C 372,198 416,208 416,256 C 416,288 392,312 360,312 C 328,312 304,288 304,256 C 304,208 348,198 360,206 Z" fill="url(#cherrySmall)" stroke="#7a0f2e" stroke-width="5"/>
    <path d="M 348,210 Q 360,216 372,210" fill="none" stroke="#7a0f2e" stroke-width="4"

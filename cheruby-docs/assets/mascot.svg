      <path d="M 300,120 C 314,90 342,76 374,82 C 364,112 340,128 300,120 Z"/>
    </g>
    <g fill="none" stroke="#3f7a2c" stroke-width="2.5" stroke-linecap="round">
      <path d="M 294,116 Q 256,100 220,94"/>
      <path d="M 262,104 L 254,92 M 242,98 L 236,88 M 264,108 L 256,118 M 242,100 L 236,110"/>
      <path d="M 306,116 Q 334,98 364,86"/>

    <ellipse cx="172" cy="334" rx="18" ry="10" fill="#ffb3c4" opacity="0.9"/>
    <ellipse cx="308" cy="334" rx="18" ry="10" fill="#ffb3c4" opacity="0.9"/>
    <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
      <path d="M 164,338 L 170,329"/>
      <path d="M 172,338 L 178,329"/>
      <path d="M 300,338 L 306,329"/>
      <path d="M 308,338 L 314,329"/>
